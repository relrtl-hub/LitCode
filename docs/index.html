<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitCode Solutions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; }

        .header { background: #16213e; padding: 16px 24px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 20px; color: #e94560; }
        .header h1 span { color: #64ffda; }
        .header .stats { font-size: 13px; color: #8892b0; background: #0f3460; padding: 4px 10px; border-radius: 4px; }

        .container { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 56px); }

        .sidebar { border-right: 1px solid #0f3460; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
        .sidebar-header h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #e94560; margin-bottom: 10px; }
        .search-box { width: 100%; padding: 8px 12px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 13px; outline: none; }
        .search-box:focus { border-color: #e94560; }
        .problem-list { flex: 1; overflow-y: auto; padding: 8px; }

        .problem-item { padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; }
        .problem-item:hover { background: #16213e; }
        .problem-item.selected { background: #16213e; border-left-color: #e94560; }
        .problem-item .problem-num { color: #555; font-size: 13px; min-width: 30px; }
        .problem-item .problem-name { color: #ccc; font-size: 13px; flex: 1; }
        .problem-item.selected .problem-name { color: #eee; font-weight: 600; }

        .badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .badge-easy { background: #1b5e20; color: #4caf50; }
        .badge-medium { background: #4a3800; color: #ffc107; }
        .badge-hard { background: #4a1420; color: #e94560; }

        .main { overflow-y: auto; padding: 32px 48px; }
        .main.empty { display: flex; align-items: center; justify-content: center; }
        .empty-state { text-align: center; color: #555; font-size: 16px; }

        .problem-header { margin-bottom: 24px; }
        .problem-header h2 { font-size: 24px; color: #eee; margin-bottom: 8px; }
        .problem-meta { display: flex; gap: 12px; align-items: center; }
        .problem-meta .complexity { font-size: 12px; color: #8892b0; background: #0f3460; padding: 4px 10px; border-radius: 4px; }

        .section { margin-bottom: 28px; }
        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #e94560; margin-bottom: 12px; font-weight: 600; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
        .section p { font-size: 14px; line-height: 1.7; color: #ccc; white-space: pre-wrap; }

        .example { background: #16213e; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.6; color: #ccc; white-space: pre-wrap; border-left: 3px solid #0f3460; }
        .constraint { font-size: 13px; color: #8892b0; padding: 4px 0; }

        .code-block { background: #0d1117; border-radius: 8px; padding: 18px 20px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; color: #c9d1d9; white-space: pre; border: 1px solid #0f3460; }

        .explanation-text { font-size: 14px; line-height: 1.8; color: #ccc; }
        .explanation-text strong { color: #64ffda; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #1a4a7a; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lit<span>Code</span></h1>
        <span class="stats" id="problem-count">0 problems</span>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Problems</h2>
                <input type="text" class="search-box" id="search" placeholder="Search problems..." />
            </div>
            <div class="problem-list" id="problem-list">
            </div>
        </div>

        <div class="main empty" id="main-content">
            <div class="empty-state">Select a problem from the list</div>
        </div>
    </div>

    <script>
        let problems = [];
        let selectedId = null;

        async function loadProblems() {
            const res = await fetch('data/problems.json');
            problems = await res.json();
            document.getElementById('problem-count').textContent = `${problems.length} problems`;
            renderList(problems);
        }

        function renderList(list) {
            const container = document.getElementById('problem-list');
            container.innerHTML = list.map(p => `
                <div class="problem-item ${p.id === selectedId ? 'selected' : ''}" onclick="selectProblem('${p.id}')">
                    <span class="problem-num">${p.number}.</span>
                    <span class="problem-name">${p.name}</span>
                    <span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
                </div>
            `).join('');
        }

        async function selectProblem(id) {
            selectedId = id;
            renderList(problems.filter(p => {
                const q = document.getElementById('search').value.toLowerCase();
                return !q || p.name.toLowerCase().includes(q) || String(p.number).includes(q);
            }));

            const p = problems.find(prob => prob.id === id);
            if (!p) return;

            const main = document.getElementById('main-content');
            main.classList.remove('empty');

            const examples = p.examples.map(e => `<div class="example">${escapeHtml(e)}</div>`).join('');
            const constraints = p.constraints.map(c => `<div class="constraint">- ${escapeHtml(c)}</div>`).join('');

            main.innerHTML = `
                <div class="problem-header">
                    <h2>${p.number}. ${escapeHtml(p.name)}</h2>
                    <div class="problem-meta">
                        <span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
                        <span class="complexity">Time: ${escapeHtml(p.timeComplexity)}</span>
                        <span class="complexity">Space: ${escapeHtml(p.spaceComplexity)}</span>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Description</div>
                    <p>${escapeHtml(p.description)}</p>
                </div>

                <div class="section">
                    <div class="section-title">Examples</div>
                    ${examples}
                </div>

                <div class="section">
                    <div class="section-title">Solution</div>
                    <div class="code-block">${escapeHtml(p.solutionCode)}</div>
                </div>

                <div class="section">
                    <div class="section-title">Explanation</div>
                    <div class="explanation-text">${formatExplanation(p.explanation)}</div>
                </div>

                ${p.exampleWalkthrough ? `
                <div class="section">
                    <div class="section-title">Example Walkthrough</div>
                    <div class="code-block">${formatExplanation(p.exampleWalkthrough)}</div>
                </div>
                ` : ''}

                <div class="section">
                    <div class="section-title">Constraints</div>
                    ${constraints}
                </div>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatExplanation(text) {
            if (!text) return '';
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = problems.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.number).includes(q));
            renderList(filtered);
        });

        loadProblems();
    </script>
</body>
</html>
